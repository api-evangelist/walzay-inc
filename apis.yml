  with vetted remote and in-office software, engineering, and sales professionals —
  largely sourced from the Middle East and other emerging markets — and offers white-glove
  recruiting alongside a self-serve candidate marketplace. Walzay is backed by 500
  Global and the Sanabil 500 MENA Seed Accelerator. No public API or developer surface
